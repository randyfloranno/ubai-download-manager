[workspace]
resolver = "3"
members = [
    "crates/udm-core",
    "crates/udm-i18n",
    "crates/udm-proto",
    "crates/udm-store",
    "crates/udm-net",
    "crates/udm-secrets",
    "crates/udm-sys",
    "crates/udm-engine",
    "crates/udm-control",
    "crates/udm-app",
    "crates/udm-cli",
    "crates/udm-native-host",
    "crates/udm-ext",
    "crates/udm-testsrv",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/randyfloranno/ubai-download-manager"
publish = false
rust-version = "1.88"

[workspace.dependencies]
udm-core = { path = "crates/udm-core" }
udm-i18n = { path = "crates/udm-i18n" }
udm-proto = { path = "crates/udm-proto" }
udm-store = { path = "crates/udm-store" }
udm-net = { path = "crates/udm-net" }
udm-secrets = { path = "crates/udm-secrets" }
udm-sys = { path = "crates/udm-sys" }
udm-engine = { path = "crates/udm-engine" }
udm-control = { path = "crates/udm-control" }
udm-testsrv = { path = "crates/udm-testsrv" }

tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
bytes = "1.12"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hyper = { version = "1.12", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1.5"
http-body-util = "0.1"
h2 = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.6"
rustls-pki-types = "1"
rcgen = "0.14"
url = "2.5"
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
toml = "0.8"
unic-langid = "0.9"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4.5", features = ["derive"] }
fs4 = { version = "1.1", features = ["sync"] }
arboard = { version = "3.7", default-features = false }
notify-rust = "4.18"
keyring = "4.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
proptest = "1"
tempfile = "3"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit", "wayland", "x11"] }
png = "0.18"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
