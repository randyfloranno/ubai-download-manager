[package]
name = "udm-app"
description = "UDM desktop application."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "udm"
path = "src/main.rs"

[features]
default = ["dev-sample"]
# `--sample`: in-process test server + seeded queue. Off in release packaging.
dev-sample = ["dep:udm-testsrv"]

[dependencies]
udm-core.workspace = true
udm-i18n.workspace = true
udm-store.workspace = true
udm-sys.workspace = true
udm-secrets.workspace = true
udm-engine.workspace = true
udm-control.workspace = true
udm-testsrv = { workspace = true, optional = true }
eframe.workspace = true
png.workspace = true
tokio.workspace = true
serde_json.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
